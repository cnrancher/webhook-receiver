name: Push to Master

on:
  push:
    tags:
      - "v*.*.*" # Matches any tag that starts with 'v' and follows semantic versioning
      - "v*.*.*-ent*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to TCR
        uses: docker/login-action@v3
        with:
          registry: registry.rancher.cn
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_TOKEN }}
      - name: CI
        env:
          CROSS: "true"
        run: make ci
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.rancher.cn/${{ vars.REPO || 'cnrancher' }}/${{ vars.IMAGE || 'webhook-receiver' }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build to Dockerhub
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64/v8
          file: package/Dockerfile
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          tags: "${{ steps.meta.outputs.tags }}"
          sbom: true
          provenance: true
          push: true
      - name: checksum
        run: |
          cd dist/artifacts
          sha256sum ./* > sha256sum.txt
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/artifacts/*"
          draft: true
  image-sign:
    permissions:
      contents: read
      id-token: write # required for hangar sign OIDC keyless mode
    runs-on: ubuntu-latest
    needs: [ build-and-deploy ]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref_name}}
    - name: Login to TCR
      uses: docker/login-action@v3
      with:
        registry: registry.rancher.cn
        username: ${{ secrets.TCR_USERNAME }}
        password: ${{ secrets.TCR_TOKEN }}
    - name: Hangar Sign
      uses: cnrancher/hangar/.github/actions/hangar-sign@main
      with:
        version: v1.9.0-beta.14
        images: |
          registry.rancher.cn/cnrancher/webhook-receiver:${{ github.ref_name }}
